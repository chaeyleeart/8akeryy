<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Booth — 전시 종료 · 8akeryy</title>
<meta name="description" content="8akeryy AI 포토부스는 전시와 함께 종료되었습니다. 기록은 전시 아카이브에서 만나보세요." />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{--cream:#F7EDD2;--sage:#C9D2CA;--pink:#EFD3D7;--pink-deep:#CD8E96;--ink:#3E3216;--ink-soft:#8C7C5C;--line:#E9E0CC;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:#fff;color:var(--ink);font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px;}
.stripe-band{position:fixed;left:0;right:0;height:10px;
  background-image:repeating-linear-gradient(90deg,var(--sage) 0 11px,transparent 11px 30px),
  repeating-linear-gradient(90deg,var(--pink) 20px 23px,transparent 23px 30px);}
.stripe-band.top{top:0;}
.stripe-band.bottom{bottom:0;}
.card{max-width:460px;width:100%;text-align:center;animation:up .8s cubic-bezier(.2,.75,.2,1) both;}
@keyframes up{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.card img.logo{height:34px;margin:0 auto 30px;display:block;}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--pink-deep);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:8px 18px;margin-bottom:22px;}
h1{font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.35;margin-bottom:18px;}
p{font-size:14.5px;line-height:1.95;color:var(--ink-soft);margin-bottom:10px;}
.btn{display:inline-block;margin-top:26px;font-weight:600;font-size:14px;letter-spacing:.02em;color:#fff;
  background:var(--ink);border-radius:999px;padding:15px 32px;text-decoration:none;transition:background .3s,transform .3s;}
.btn:hover{background:var(--pink-deep);transform:translateY(-2px);}
.sub{margin-top:18px;font-size:12.5px;color:var(--ink-soft);}
.sub a{color:var(--pink-deep);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="stripe-band top"></div>
<main class="card">
  <img class="logo" src="assets/mainlogo.png" alt="8akeryy" />
  <div class="badge">Exhibition Ended · 2026. 8. 21</div>
  <h1>AI 포토부스는<br>전시와 함께 마무리됐어요</h1>
  <p>사흘 동안 강아지들 사이에 앉아 주신 모든 손님, 고맙습니다.<br>게시에 동의해 주신 분들의 결과물과 부스의 기록은<br>전시 아카이브에 그대로 남아 있어요.</p>
  <a class="btn" href="../archive.html#booth">전시 아카이브 보러 가기 →</a>
  <div class="sub">문의 · <a href="mailto:8akeryy@gmail.com">8akeryy@gmail.com</a></div>
</main>
<div class="stripe-band bottom"></div>
</body>
</html>
